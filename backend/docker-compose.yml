# This compose file is for local backend development.
# When running `docker compose up -d` inside the backend directory,
# it starts ONLY the PostgreSQL database without running the containerized backend.

name: loom

services:
  postgres:
    image: postgres:16-alpine
    container_name: loom-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-loom_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-loom_db}"]
      interval: 3s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
    name: loom_postgres_data
